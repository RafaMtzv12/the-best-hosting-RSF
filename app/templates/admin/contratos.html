{% extends "admin/base_admin.html" %}
{% block titulo %}Contratos{% endblock %}

{% block contenido %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <h1 class="h3 m-0">Contratos de clientes</h1>
  <div class="d-flex gap-2">
    <input class="form-control" type="search" id="buscarTabla" placeholder="Buscar cliente, dominio o plan…" aria-label="Buscar contrato">
    <button class="btn btn-rojo text-nowrap" type="button" data-nuevo>+ Nuevo contrato</button>
  </div>
</div>
<div class="table-responsive card">
  <table class="table table-hover align-middle m-0">
    <thead><tr><th>Cliente</th><th>Dominio</th><th>Plan</th><th>Inicio</th><th>Vencimiento</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead>
    <tbody id="tabla"><tr><td colspan="7" class="text-center text-muted">Cargando…</td></tr></tbody>
  </table>
</div>

<div class="modal fade" id="modalForm" tabindex="-1" aria-labelledby="tituloModal" aria-hidden="true">
  <div class="modal-dialog">
    <form class="modal-content" id="formulario" novalidate>
      <div class="modal-header"><h2 class="modal-title h5" id="tituloModal">Contrato</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
      <div class="modal-body">
        <div class="mb-3"><label class="form-label" for="f-cliente">Cliente *</label>
          <input class="form-control" id="f-cliente" name="cliente_nombre" maxlength="120" required><div class="invalid-feedback"></div></div>
        <div class="mb-3"><label class="form-label" for="f-correo">Correo *</label>
          <input class="form-control" id="f-correo" name="correo" type="email" maxlength="120" required><div class="invalid-feedback"></div></div>
        <div class="mb-3"><label class="form-label" for="f-dominio">Dominio *</label>
          <input class="form-control" id="f-dominio" name="dominio" maxlength="120" placeholder="miempresa.com" required><div class="invalid-feedback"></div></div>
        <div class="mb-3"><label class="form-label" for="f-plan">Plan *</label>
          <select class="form-select" id="f-plan" name="plan_id" required>
            <option value="">Selecciona…</option>
            {% for p in planes %}<option value="{{ p.id }}">{{ p.nombre }} ({{ p.tipo.nombre }})</option>{% endfor %}
          </select><div class="invalid-feedback"></div></div>
        <div class="row g-3">
          <div class="col-6"><label class="form-label" for="f-inicio">Inicio *</label>
            <input class="form-control" id="f-inicio" name="fecha_inicio" type="date" required><div class="invalid-feedback"></div></div>
          <div class="col-6"><label class="form-label" for="f-vence">Vencimiento *</label>
            <input class="form-control" id="f-vence" name="fecha_vencimiento" type="date" required><div class="invalid-feedback"></div></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-rojo" data-guardar>Guardar</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}<script src="{{ url_for('static', filename='js/admin_contratos.js') }}"></script>{% endblock %}
