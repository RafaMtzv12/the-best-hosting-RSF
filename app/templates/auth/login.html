<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso de administradores | The Best Hosting</title>
  <link rel="icon" type="image/webp" href="{{ url_for('static', filename='img/menu/web_hosting.webp') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="login-fondo">
<main class="login-caja">
  <img src="{{ url_for('static', filename='img/sitio/logo.webp') }}" alt="The Best Hosting" width="194" height="102">
  <h1 class="h5">Acceso de administradores</h1>
  {% for categoria, mensaje in get_flashed_messages(with_categories=true) %}
    <div class="alert alert-{{ categoria }} py-2" role="alert">{{ mensaje }}</div>
  {% endfor %}
  <form method="post" novalidate>
    <div class="mb-3 text-start">
      <label class="form-label" for="usuario">Usuario</label>
      <input class="form-control" id="usuario" name="usuario" required autofocus autocomplete="username"
             value="{{ request.form.get('usuario', '') }}">
    </div>
    <div class="mb-3 text-start">
      <label class="form-label" for="password">Contraseña</label>
      <input class="form-control" id="password" name="password" type="password" required autocomplete="current-password">
    </div>
    <button class="btn btn-rojo w-100" type="submit">Entrar</button>
  </form>
  <a class="d-block mt-3 small" href="{{ url_for('public.inicio') }}">&larr; Volver al sitio</a>
</main>
</body>
</html>
